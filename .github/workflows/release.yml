# v로 시작하는 태그(예: v0.4.1)를 푸시하면 맥용 dmg를 빌드해서 Releases에 올림
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 기본은 읽기 전용, 릴리스 업로드 잡에만 쓰기 권한
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest   # Apple Silicon (arm64)
    permissions:
      contents: write      # 릴리스 업로드
      id-token: write      # 빌드 출처 증명(attestation) 서명
      attestations: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Planner v__VERSION__"
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## 설치
            1. 아래 **Planner_*_aarch64.dmg** 를 받아서 열고, Planner를 응용 프로그램 폴더로 끌어다 놓기
            2. 터미널에서 한 번 실행 (서명 안 된 앱이라 "손상됨" 경고 방지): `xattr -cr /Applications/Planner.app`
            3. 이전 버전이 켜져 있으면 메뉴바 아이콘 우클릭 → 종료 후 새로 열기

            데이터는 앱과 별도로 저장돼서 업데이트해도 그대로 유지돼요.

      - name: SHA256 체크섬 업로드
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src-tauri/target/release/bundle/dmg
        run: |
          VERSION=$(node -p "require('../../../../tauri.conf.json').version")
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "v$VERSION" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"

      - name: 빌드 출처 증명 (이 저장소의 Actions에서 빌드됐음을 서명)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src-tauri/target/release/bundle/dmg/*.dmg
